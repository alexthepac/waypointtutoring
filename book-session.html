<style>

    --paper: #f7f5f1;

  /* ---------- Mobile polish ---------- */

  a, button, [onclick] { -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; }   /* removes the double-tap-to-zoom delay on links/buttons */
  /* iOS auto-zooms into form fields under 16px - keep them at 16px on phones */
  @media (max-width: 767px) { input, textarea, select { font-size: 16px !important; } }
  @media (max-width: 767px) { .backdrop-blur-md { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; } }
  .eyebrow-grad { background: var(--grad-eyebrow); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  /* The Cal.com inline embed grows to fit; give it room so the calendar

  #cal-embed { min-height: 640px; width: 100%; overflow: auto; }

<body class="bg-paper text-ink antialiased">

<!-- Header -->

      <!-- Language Switcher -->
      <div class="relative">
        <button onclick="toggleLangMenu()" class="inline-flex items-center gap-1.5 text-neutral-600 text-sm font-medium hover:text-ink transition-colors">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          EN
        </button>
        <div id="langMenu" class="hidden absolute right-0 mt-2 w-32 bg-white rounded-xl shadow-xl overflow-hidden z-50">
          <a id="lang-en" href="book-session.html" class="block px-4 py-3 text-sm text-black bg-neutral-100">English</a>
          <a id="lang-fr" href="book-session-fr.html" class="block px-4 py-3 text-sm text-black hover:bg-neutral-100 transition-colors">Français</a>

<!-- Cal.com embed loader (official snippet) -->
<script>
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
</script>

<script>
  /* Language switcher */
  function toggleLangMenu() {
    var menu = document.getElementById('langMenu');
    if (menu) {
      menu.classList.toggle('hidden');
    }
  }

  // Close language menu when clicking outside
  document.addEventListener('click', function(e) {
    var menu = document.getElementById('langMenu');
    var button = e.target.closest('button');
    if (menu && !menu.contains(e.target) && (!button || !button.onclick || !button.onclick.toString().includes('toggleLangMenu'))) {
      menu.classList.add('hidden');
    }
  });

  /* =====================================================================
     EMBEDDED BOOKING with Google Ads conversion tracking.
     ?service= picks which PAID Cal.com event to embed. When the visitor
     completes a booking, the embed fires "bookingSuccessful" and we send
     the Purchase conversion with the booking uid as transaction_id so
     each booking counts exactly once. Free package sessions do NOT go
     through this page, so they are never counted as sales.
  ===================================================================== */
  var SERVICES = {
    tutoring: {
      name: 'Private 1-on-1 STEM Tutoring',
      price: '$35 per 60-minute session — pay while booking below.',
      cal: 'mntr-iif8ix/1-on-1-tutoring'
    },
    'casper-hourly': {
      name: 'Casper & MMI Prep',
      price: '$35 per 60-minute session — pay while booking below.',
      cal: 'mntr-iif8ix/1-on-1-casper-and-mmi-prep-copy'
    }
  };

  var key = new URLSearchParams(window.location.search).get('service');
  var svc = SERVICES[key];

  if (!svc) {
    window.location.replace('index.html#services');
  } else {
    document.getElementById('svc-name').textContent = svc.name;
    document.getElementById('svc-price').textContent = svc.price;
    document.getElementById('cal-direct').href = 'https://cal.com/' + svc.cal;
    document.getElementById('lang-en').href = 'book-session.html?service=' + encodeURIComponent(key);
    document.getElementById('lang-fr').href = 'book-session-fr.html?service=' + encodeURIComponent(key);
    document.title = svc.name + ' · Book · MNTR Tutoring';

    Cal("init", { origin: "https://cal.com" });
    Cal("inline", { elementOrSelector: "#cal-embed", calLink: svc.cal, layout: "month_view" });
    Cal("on", {
      action: "bookingSuccessful",
      callback: function (e) {
        try {
          var d = (e && e.detail && e.detail.data) || {};
          var uid = (d.booking && (d.booking.uid || d.booking.id)) || d.uid || '';
          var txid = uid ? 'cal-' + uid : 'cal-' + key + '-' + Date.now();
          // sessionStorage guard: never send the same booking twice from this tab
          if (!sessionStorage.getItem('conv-' + txid)) {
            sessionStorage.setItem('conv-' + txid, '1');
            gtag('event', 'conversion', {
              'send_to': 'AW-18318813201/wszKCNuflM8cEJHQi59E',
              'transaction_id': txid
            });
          }
        } catch (err) { /* tracking must never break booking */ }
      }
    });
  }
</script>
