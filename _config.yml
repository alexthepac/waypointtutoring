# GitHub Pages (Jekyll) build settings for mntrtutoring.ca.
#
# Folders starting with "_" (_legacy, _mockups, _tools, _audit) are never
# published. The list below keeps the rest of the private material in this
# folder off the public site too: backend source and config, internal notes,
# and photos of people that no page uses (including former team members).
# The files stay in the repository; they are just not served.
#
# The Cloudflare Worker deploys from worker.js + wrangler.toml at the repo
# root; excluding them here does not affect that deploy.

exclude:
  # backend (deployed to Cloudflare, not to the website)
  - worker.js
  - wrangler.toml
  - backend
  # internal documentation
  - README-REDESIGN.md
  - DESIGN.md
  - PRODUCT.md
  - "*.md"
  # unused photos of people
  - "Image of Bassma.jpg"
  - bassma.jpg
  - daphne.jpg
  - ziyi.jpg
  - "Mani pic.jpg"
  - alex.jpg
  - daniel.jpg
  - james.jpg
  - james.jpeg
  - laura.jpg
  - noa.jpg
  - sofia.jpg
